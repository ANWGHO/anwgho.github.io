        "text": "如果今夜晴朗，\n我所见的月，\n该如薄纱下，\n瞧，\n你的眉目。\n我曾像你，你也曾像我……\n闲暇的草地，\n安静后，\n此刻在等入眠。\n此刻，\n从蒸发的空气里蒸发，\n一股莫名气体。"

    <h1 class="poem-title-t">缺了一半的你</h1>
    <div class="poem-content-c">
        <p>如果今夜晴朗，</p>
        <p>我所见的月，</p>
        <p>该如薄纱下，</p>
        <p>瞧，</p>
        <p>你的眉目。</p>
        <br>
        <p>我曾像你，你也曾像我……</p>
        <br>
        <p>闲暇的草地，</p>
        <p>安静后，</p>
        <p>此刻在等入眠。</p>
        <p>此刻，</p>
        <p>从蒸发的空气里蒸发，</p>
        <p>一股莫名气体。</p>
