        "text": "偷月亮的贼。\n野草堆积荒芜，\n月光浸浴在，\n兔子精灵的童话世界。\n山谷深嵌，\n布满玫瑰的大地，\n行迹成谜的巨人，\n像欲望不被填满的好战分子，\n不停地，\n用天然赠予的烟灰缸，\n潜藏进生锈的鼻子，\n它思考的身影。"
    }

    <h1 class="poem-title-t">假如用放大镜观察</h1>
    <div class="poem-content-c">
        <p>偷月亮的贼。</p>
        <p>野草堆积荒芜，</p>
        <p>月光浸浴在，</p>
        <p>兔子精灵的童话世界。</p>
        <br>
        <p>山谷深嵌，</p>
        <p>布满玫瑰的大地，</p>
        <p>行迹成谜的巨人，</p>
        <p>像欲望不被填满的好战分子，</p>
        <p>不停地，</p>
        <p>用天然赠予的烟灰缸，</p>
        <p>潜藏进生锈的鼻子，</p>
        <p>它思考的身影。</p>
