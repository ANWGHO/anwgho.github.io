        "text": "黑暗森林，\n漫游的年老生命，\n在逐渐衰竭，\n和仓促的呼吸。\n没有白天的动物世界，\n松鼠在枝上快步，\n标注新家的记号，\n镶嵌满闪亮光珠。\n若非黑夜笼罩的图景，\n便不会，\n嘎吱嘎吱，\n传来阵阵清脆的声音。"
    }

    <h1 class="poem-title-t">梦幻梦</h1>
    <div class="poem-content-c">
        <p>黑暗森林，</p>
        <p>漫游的年老生命，</p>
        <p>在逐渐衰竭，</p>
        <p>和仓促的呼吸。</p>
        <br>
        <p>没有白天的动物世界，</p>
        <p>松鼠在枝上快步，</p>
        <p>标注新家的记号，</p>
        <p>镶嵌满闪亮光珠。</p>
        <br>
        <p>若非黑夜笼罩的图景，</p>
        <p>便不会，</p>
        <p>嘎吱嘎吱，</p>
        <p>传来阵阵清脆的声音。</p>
