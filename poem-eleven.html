        "text": "勇敢故事的梦，\n哼着歌来。\n携带有用的利器，\n瞬间施法的魔杖。\n指挥合法财产，\n活人便从镜中走出，\n裹着石膏，\n一副被绑架的躯体。\n到一处绝佳方位，\n不同时间进入，循环，\n侵扰人熟睡，扩散，\n显露野心，树与根蔓。"
    }

    <h1 class="poem-title-t">自然访谈</h1>
    <div class="poem-content-c">
        <p>勇敢故事的梦，</p>
        <p>哼着歌来。</p>
        <br>
        <p>携带有用的利器，</p>
        <p>瞬间施法的魔杖。</p>
        <br>
        <p>指挥合法财产，</p>
        <p>活人便从镜中走出，</p>
        <p>裹着石膏，</p>
        <p>一副被绑架的躯体。</p>
        <br>
        <p>到一处绝佳方位，</p>
        <p>不同时间进入，循环，</p>
        <p>侵扰人熟睡，扩散，</p>
        <p>显露野心，树与根蔓。</p>
    </div>
