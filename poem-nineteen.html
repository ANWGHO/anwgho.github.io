        "text": "乌鸦占领电线杆，\n厚重涂料，\n压迫自然的建筑。\n心中的战火，\n从古代烧至未来。\n失神的母亲，\n眼中胜与负的亡灵，\n大张旗鼓的对峙，\n迷恋纯粹恐怖的浪漫。"
    }

    <h1 class="poem-title-t">爱神的来信</h1>
    <div class="poem-content-c">
        <p>乌鸦占领电线杆，</p>
        <p>厚重涂料，</p>
        <p>压迫自然的建筑。</p>
        <br>
        <p>心中的战火，</p>
        <p>从古代烧至未来。</p>
        <br>
        <p>失神的母亲，</p>
        <p>眼中胜与负的亡灵，</p>
        <p>大张旗鼓的对峙，</p>
        <p>迷恋纯粹恐怖的浪漫。</p>
