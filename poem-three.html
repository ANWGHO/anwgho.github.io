        "text": "小屋，灌木林。\n有人窥探，\n爆炸声留下的遗迹。\n抄近路走泥泞河道，\n推行锚发出声响，\n乘死亡的一只船。\n滴漏的油，\n燃起的火，\n时间湛入泥土。\n庆祝时，\n巧借上帝名义，\n离开这里。"
    }

    <h1 class="poem-title-t">船影</h1>
    <div class="poem-content-c">
        <p>小屋，灌木林。</p>
        <p>有人窥探，</p>
        <p>爆炸声留下的遗迹。</p>
        <br>
        <p>抄近路走泥泞河道，</p>
        <p>推行锚发出声响，</p>
        <p>乘死亡的一只船。</p>
        <br>
        <p>滴漏的油，</p>
        <p>燃起的火，</p>
        <p>时间湛入泥土。</p>
        <br>
        <p>庆祝时，</p>
        <p>巧借上帝名义，</p>
        <p>离开这里。</p>
    </div>
