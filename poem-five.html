        "text": "不用说话，\n话已被说尽。\n远古的朋友，\n黑眼珠美人。\n观察闪电，\n其实是幽灵在出没。\n行走的垂败，\n凋零的身影，\n黄叶子和绿叶子的土地。\n像梦中，\n反复梦见你，\n像城堡拥有红色的心。"

    <h1 class="poem-title-t">动人的束缚</h1>
    <div class="poem-content-c">
        <p>不用说话，</p>
        <p>话已被说尽。</p>
        <p>远古的朋友，</p>
        <p>黑眼珠美人。</p>
        <br>
        <p>观察闪电，</p>
        <p>其实是幽灵在出没。</p>
        <p>行走的垂败，</p>
        <p>凋零的身影，</p>
        <p>黄叶子和绿叶子的土地。</p>
        <br>
        <p>像梦中，</p>
        <p>反复梦见你，</p>
        <p>像城堡拥有红色的心。</p>
